; PlatformIO Project Configuration File
; Chapter 10: FreeRTOS Implementation
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

monitor_speed = 115200

; Arduino_LED_Matrix and Servo are part of the Arduino core for Uno R4 WiFi

build_flags =
    -D ARDUINO_UNOR4_WIFI
