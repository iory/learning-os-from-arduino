; PlatformIO Project Configuration File
; Advanced 4: LittleFS on RA4M1 Data Flash
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

monitor_speed = 115200


build_flags =
    -D ARDUINO_UNOR4_WIFI

lib_deps =
    rw0402/littlefs@^2.9.3
