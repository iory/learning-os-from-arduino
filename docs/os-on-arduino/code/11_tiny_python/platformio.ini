; PlatformIO Project Configuration File
; Chapter 11: Tiny Python - A Minimal Python Interpreter
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

monitor_speed = 115200

build_flags =
    -D ARDUINO_UNOR4_WIFI
    -std=gnu++17
