; PlatformIO Project Configuration File
; Chapter 7: LED Matrix Visualization (os_kernel + shell + os_display)
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

monitor_speed = 115200

; Arduino_LED_Matrix is part of the Arduino core for Uno R4 WiFi

build_flags =
    -D ARDUINO_UNOR4_WIFI
