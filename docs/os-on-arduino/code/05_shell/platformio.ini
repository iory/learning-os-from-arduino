; PlatformIO Project Configuration File
; Chapter 5: Interactive Shell
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[platformio]
; 既定は実機向けのビルド。シミュレータは `pio run -e sim` で明示的に選ぶ。
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

monitor_speed = 115200

build_flags =
    -D ARDUINO_UNOR4_WIFI

; 実機なしで動かすための環境（付録「実機がなくても試せる」）。
; NO_USB は Arduino コア公式のフラグで、Serial が USB CDC ではなく
; ハードウェア UART になる。エミュレータには USB が無いのでこれが要る。
; サンプルコードは 1 行も変えない。
[env:sim]
extends = env:uno_r4_wifi
build_flags = ${env:uno_r4_wifi.build_flags} -D NO_USB
