; Chapter 13: 四脚ロボット — Physical AI への一歩
;
; Build  : uv run pio run -d 13_quadruped
; Upload : uv run pio run -d 13_quadruped -t upload
; Monitor: uv run pio device monitor -b 115200
;
; サーボの電源はバッテリから取ること。マイコンの 5 V からは取らない
; (1 個あたりストール 2.7 A、8 個で 21.6 A)。
;
; env は 4 つ。サーボ (Feetech / RCB-4) と、指令の経路 (USB シリアル / WiFi) の組み合わせ。
;   uno_r4_wifi           Feetech + USB シリアル (本文どおり)
;   uno_r4_wifi_rcb4      RCB-4   + USB シリアル。先に include/quad_calib_rcb4.h を埋めること
;   uno_r4_wifi_udp       Feetech + WiFi (host/quad_host.py wifi)
;   uno_r4_wifi_rcb4_udp  RCB-4   + WiFi
; WiFi 版は include/arduino_secrets.example.h を arduino_secrets.h に写して埋めること。
;   uv run pio run -d 13_quadruped -e uno_r4_wifi_rcb4_udp -t upload
;
; それぞれに _imu を付けた env は、胴体前面のセンサ基板の IMU も読むポリシー
; (include/arduino_quad_policy_imu.h) を使う。基板を Qwiic につないだ機体だけで使うこと。
;   uv run pio run -d 13_quadruped -e uno_r4_wifi_rcb4_imu -t upload

[platformio]
; -e を付けなければ本文どおりの Feetech 版だけをビルド・書き込みする
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

monitor_speed = 115200

build_flags =
    -D ARDUINO_UNOR4_WIFI
    -D QUADRUPED_NUM_LEGS=4
    -D QUADRUPED_DOF_PER_LEG=2

build_src_filter = +<*> -<main_wifi.cpp> -<servo_bus_rcb4.cpp> -<rcb4_link.cpp>

; RCB-4 mini (反転 UART 1.25 Mbps) を D8/D9 から叩く版。servo_bus.h の
; 関数をそのまま差し替えるので、main.cpp と制御ループは同じものが走る。
[env:uno_r4_wifi_rcb4]
extends = env:uno_r4_wifi

build_flags =
    ${env:uno_r4_wifi.build_flags}
    -D QUAD_SERVO_RCB4

build_src_filter = +<*> -<main_wifi.cpp> -<servo_bus.cpp>

; WiFi 版。main.cpp の代わりに main_wifi.cpp が走り、速度を UDP で受け取る。
[env:uno_r4_wifi_udp]
extends = env:uno_r4_wifi

build_src_filter = +<*> -<main.cpp> -<servo_bus_rcb4.cpp> -<rcb4_link.cpp>

[env:uno_r4_wifi_rcb4_udp]
extends = env:uno_r4_wifi_rcb4

build_src_filter = +<*> -<main.cpp> -<servo_bus.cpp>

; IMU 版。ポリシーが違うだけで、ソースは上の 4 つと同じ。
[env:uno_r4_wifi_imu]
extends = env:uno_r4_wifi

build_flags =
    ${env:uno_r4_wifi.build_flags}
    -D QUAD_POLICY_IMU

[env:uno_r4_wifi_rcb4_imu]
extends = env:uno_r4_wifi_rcb4

build_flags =
    ${env:uno_r4_wifi_rcb4.build_flags}
    -D QUAD_POLICY_IMU

[env:uno_r4_wifi_udp_imu]
extends = env:uno_r4_wifi_udp

build_flags =
    ${env:uno_r4_wifi_udp.build_flags}
    -D QUAD_POLICY_IMU

[env:uno_r4_wifi_rcb4_udp_imu]
extends = env:uno_r4_wifi_rcb4_udp

build_flags =
    ${env:uno_r4_wifi_rcb4_udp.build_flags}
    -D QUAD_POLICY_IMU
