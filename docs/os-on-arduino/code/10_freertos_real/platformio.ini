; PlatformIO Project Configuration File
; Chapter 10: 本物の FreeRTOS（コア同梱の Arduino_FreeRTOS）を使う掲載例
;
; 原稿 10.3〜10.10 の各掲載例を 1 つずつ env にしてある。
; すべてビルド:  pio run
; 1 つだけ:      pio run -e integrated
; 書き込み:      pio run -e basic -t upload

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_UNOR4_WIFI
build_src_filter = -<*>

[env:basic]
build_src_filter = -<*> +<basic.cpp>

[env:preemptive]
build_src_filter = -<*> +<preemptive.cpp>

[env:task_control]
build_src_filter = -<*> +<task_control.cpp>

[env:semaphore]
build_src_filter = -<*> +<semaphore.cpp>

[env:queue]
build_src_filter = -<*> +<queue.cpp>

[env:integrated]
build_src_filter = -<*> +<integrated.cpp>
lib_deps = arduino-libraries/Servo@^1.2.2
